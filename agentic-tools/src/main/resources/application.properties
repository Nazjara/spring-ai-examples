spring.application.name=spring-ai-agentic-tools

spring.ai.anthropic.api-key=${ANTHROPIC_API_KEY}
spring.ai.anthropic.chat.model=claude-sonnet-5

spring.ai.tools.limits.max-calls-per-tool-default=5
spring.ai.tools.limits.max-total-tool-calls=20
spring.ai.tools.limits.on-limit-exceeded=return-error-response

logging.level.org.springframework.ai.chat.client.advisor.SimpleLoggerAdvisor=DEBUG
spring.ai.chat.client.tool-search-advisor.enabled=false
